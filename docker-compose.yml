# Local development: `mise run dev`. The app is on http://localhost:5173 (Vite, proxying /api to
# Django), Mailpit on http://localhost:8025 and the RustFS console on
# http://localhost:9001/rustfs/console/.

x-backend: &backend
  build:
    context: .
    dockerfile: docker/api.Dockerfile
  env_file:
    - path: .env
      required: false
  environment:
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-not-secret}
    DJANGO_DEBUG: "true"
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
    CSRF_TRUSTED_ORIGINS: http://localhost:5173
    DATABASE_URL: postgres://lecturecast:lecturecast@postgres:5432/lecturecast
    REDIS_URL: redis://redis:6379/0
    AWS_S3_ENDPOINT_URL: http://s3:9000
    AWS_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin
    EMAIL_HOST: mailpit
    EMAIL_PORT: "1025"
  volumes:
    - ./backend:/app/backend
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lecturecast
      POSTGRES_PASSWORD: lecturecast
      POSTGRES_DB: lecturecast
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lecturecast"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  # S3-compatible storage. MinIO no longer publishes images, so RustFS (MinIO-compatible) stands in.
  s3:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [s3:/data]

  # Creates the media bucket once the S3 server is up.
  s3-setup:
    image: amazon/aws-cli:2.37.12
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - >-
        until aws --endpoint-url http://s3:9000 s3api head-bucket --bucket lecturecast-media 2>/dev/null ||
        aws --endpoint-url http://s3:9000 s3 mb s3://lecturecast-media; do sleep 1; done &&
        aws --endpoint-url http://s3:9000 s3api put-bucket-cors --bucket lecturecast-media
        --cors-configuration 'CORSRules=[{AllowedOrigins=["http://localhost:5173"],AllowedMethods=[POST,GET,HEAD],AllowedHeaders=["*"],ExposeHeaders=["ETag"],MaxAgeSeconds=3000}]'

  mailpit:
    image: axllent/mailpit:v1.31.5
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  api:
    <<: *backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports: ["127.0.0.1:8000:8000"]

  worker:
    <<: *backend
    command: celery -A lecturecast worker --loglevel=info

  web:
    image: node:24
    working_dir: /app/frontend
    command: sh -c "npm install -g pnpm@12.11.2 && pnpm install && pnpm dev --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:8000
    ports: ["127.0.0.1:5173:5173"]
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on: [api]

volumes:
  postgres:
  s3:
