openapi: 3.0.3
info:
  title: LectureCast API
  version: 1.0.0
  description: The LectureCast backend API.
paths:
  /api/catalog:
    get:
      operationId: catalog_list
      parameters:
      - in: query
        name: include_unplayable
        schema:
          type: boolean
        description: Also list courses with no playable lecture yet.
      tags:
      - catalog
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogCourse'
          description: ''
  /api/catalog/{course_id}:
    get:
      operationId: catalog_retrieve
      parameters:
      - in: path
        name: course_id
        schema:
          type: integer
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogCourse'
          description: ''
  /api/catalog/{course_id}/reports:
    post:
      operationId: catalog_reports_create
      parameters:
      - in: path
        name: course_id
        schema:
          type: integer
        required: true
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentReportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContentReportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContentReportRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentReport'
          description: ''
  /api/catalog/licenses:
    get:
      operationId: catalog_licenses_list
      tags:
      - catalog
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/License'
          description: ''
  /api/catalog/takedowns:
    post:
      operationId: catalog_takedowns_create
      description: Rights holders may not have accounts, so this is open to anyone
        and rate limited.
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TakedownRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TakedownRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TakedownRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakedownRequest'
          description: ''
  /api/courses/:
    get:
      operationId: courses_list
      tags:
      - courses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
          description: ''
    post:
      operationId: courses_create
      tags:
      - courses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Course'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Course'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Course'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
  /api/courses/{course_id}/estimate:
    post:
      operationId: courses_estimate_create
      parameters:
      - in: path
        name: course_id
        schema:
          type: integer
        required: true
      tags:
      - pipeline
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineRunRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PipelineRunRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PipelineRunRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseEstimate'
          description: ''
  /api/courses/{course_id}/graph:
    get:
      operationId: courses_graph_retrieve
      parameters:
      - in: path
        name: course_id
        schema:
          type: integer
        required: true
      tags:
      - pipeline
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseGraph'
          description: ''
  /api/courses/{course_id}/publication:
    get:
      operationId: courses_publication_retrieve
      parameters:
      - in: path
        name: course_id
        schema:
          type: integer
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
          description: ''
    post:
      operationId: courses_publication_create
      parameters:
      - in: path
        name: course_id
        schema:
          type: integer
        required: true
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicationRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
          description: ''
  /api/courses/{course_id}/review:
    post:
      operationId: courses_review_create
      parameters:
      - in: path
        name: course_id
        schema:
          type: integer
        required: true
      tags:
      - pipeline
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseReviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CourseReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CourseReviewRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseReviewResponse'
          description: ''
  /api/courses/{course_id}/runs:
    post:
      operationId: courses_runs_create
      parameters:
      - in: path
        name: course_id
        schema:
          type: integer
        required: true
      tags:
      - pipeline
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineRunRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PipelineRunRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PipelineRunRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRun'
          description: ''
  /api/courses/{id}/:
    get:
      operationId: courses_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course.
        required: true
      tags:
      - courses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
    put:
      operationId: courses_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course.
        required: true
      tags:
      - courses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Course'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Course'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Course'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
    patch:
      operationId: courses_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course.
        required: true
      tags:
      - courses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCourse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCourse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCourse'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
  /api/courses/upload-url:
    post:
      operationId: courses_upload_url_create
      tags:
      - courses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrl'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UploadUrl'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadUrl'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
          description: ''
  /api/health:
    get:
      operationId: health_retrieve
      description: Report that the API is up and can reach the database.
      tags:
      - health
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
  /api/lectures/{lecture_id}/slides:
    get:
      operationId: lectures_slides_list
      parameters:
      - in: path
        name: lecture_id
        schema:
          type: integer
        required: true
      tags:
      - lectures
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slide'
          description: ''
  /api/moderation:
    get:
      operationId: moderation_retrieve
      tags:
      - moderation
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationQueue'
          description: ''
  /api/moderation/publications/{publication_id}:
    post:
      operationId: moderation_publications_create
      parameters:
      - in: path
        name: publication_id
        schema:
          type: integer
        required: true
      tags:
      - moderation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationAction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ModerationAction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ModerationAction'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
          description: ''
  /api/moderation/reports/{report_id}:
    post:
      operationId: moderation_reports_create
      parameters:
      - in: path
        name: report_id
        schema:
          type: integer
        required: true
      tags:
      - moderation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationAction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ModerationAction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ModerationAction'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentReport'
          description: ''
  /api/moderation/takedowns/{takedown_id}:
    post:
      operationId: moderation_takedowns_create
      parameters:
      - in: path
        name: takedown_id
        schema:
          type: integer
        required: true
      tags:
      - moderation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationAction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ModerationAction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ModerationAction'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakedownRequest'
          description: ''
  /api/nodes/{node_id}/sections:
    get:
      operationId: nodes_sections_retrieve
      parameters:
      - in: path
        name: node_id
        schema:
          type: integer
        required: true
      tags:
      - pipeline
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeSections'
          description: ''
  /api/nodes/{node_id}/sections/{n}:
    put:
      operationId: nodes_sections_update
      parameters:
      - in: path
        name: n
        schema:
          type: integer
        required: true
      - in: path
        name: node_id
        schema:
          type: integer
        required: true
      tags:
      - pipeline
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectionUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SectionUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SectionUpdateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionUpdateResponse'
          description: ''
  /api/pipeline:
    get:
      operationId: pipeline_list
      tags:
      - pipeline
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StageDefinition'
          description: ''
  /api/providers:
    get:
      operationId: providers_list
      tags:
      - providers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Provider'
          description: ''
  /api/runs/{run_id}:
    get:
      operationId: runs_retrieve
      parameters:
      - in: path
        name: run_id
        schema:
          type: integer
        required: true
      tags:
      - runs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRun'
          description: ''
components:
  schemas:
    CatalogCourse:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        provider:
          type: string
        source_url:
          type: string
        license:
          type: string
        license_name:
          type: string
        attribution:
          type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        playable_lectures:
          type: integer
        totals:
          type: object
          additionalProperties:
            type: integer
        lectures:
          type: array
          items:
            $ref: '#/components/schemas/CoverageLecture'
        contributors:
          type: array
          items:
            $ref: '#/components/schemas/Contributor'
      required:
      - attribution
      - contributors
      - id
      - lectures
      - license
      - license_name
      - playable_lectures
      - provider
      - published_at
      - source_url
      - title
      - totals
    ContentReport:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        course:
          type: integer
          readOnly: true
        course_title:
          type: string
          readOnly: true
        node:
          type: integer
          readOnly: true
          nullable: true
        reason:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ContentReportStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        resolution:
          type: string
          readOnly: true
      required:
      - course
      - course_title
      - created_at
      - id
      - node
      - reason
      - resolution
      - status
    ContentReportRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 5000
        node:
          type: integer
          nullable: true
      required:
      - reason
    ContentReportStatusEnum:
      enum:
      - open
      - resolved
      type: string
      description: |-
        * `open` - Open
        * `resolved` - Resolved
    Contributor:
      type: object
      properties:
        stage:
          type: string
        names:
          type: array
          items:
            type: string
      required:
      - names
      - stage
    Course:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        owner:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        source_url:
          oneOf:
          - type: string
            format: uri
          - type: string
            maxLength: 0
        source_file:
          type: string
          readOnly: true
        source_upload:
          type: string
          writeOnly: true
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        plugin:
          type: string
          maxLength: 100
        settings: {}
        license:
          type: string
          maxLength: 100
        visibility:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - owner
      - provider
      - source_file
      - title
      - updated_at
      - visibility
    CourseEstimate:
      type: object
      properties:
        targets:
          type: object
          additionalProperties: {}
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/StagePreview'
        estimate:
          type: object
          additionalProperties: {}
      required:
      - estimate
      - nodes
      - targets
    CourseGraph:
      type: object
      properties:
        course_id:
          type: integer
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/StageNode'
        lectures:
          type: array
          items:
            $ref: '#/components/schemas/Lecture'
      required:
      - course_id
      - lectures
      - nodes
    CourseReviewRequest:
      type: object
      properties:
        lectures:
          type: array
          items:
            $ref: '#/components/schemas/LectureReviewEntry'
      required:
      - lectures
    CourseReviewResponse:
      type: object
      properties:
        course_id:
          type: integer
        review:
          $ref: '#/components/schemas/StageNode'
        lectures:
          type: array
          items:
            $ref: '#/components/schemas/Lecture'
      required:
      - course_id
      - lectures
      - review
    CoverageLecture:
      type: object
      properties:
        number:
          type: integer
        title:
          type: string
        stages:
          type: array
          items:
            type: string
          description: Lecture stages this lecture has reached.
      required:
      - number
      - stages
      - title
    HealthResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthResponseStatusEnum'
      required:
      - status
    HealthResponseStatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
    KindEnum:
      enum:
      - image
      - markdown
      - code
      type: string
      description: |-
        * `image` - Image
        * `markdown` - Markdown
        * `code` - Code
    Lecture:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        date:
          type: string
          format: date
          readOnly: true
          nullable: true
        included:
          type: boolean
          readOnly: true
        audio:
          type: string
          format: uri
          nullable: true
          readOnly: true
        duration_ms:
          type: integer
          readOnly: true
          nullable: true
      required:
      - audio
      - date
      - duration_ms
      - id
      - included
      - name
      - number
      - title
    LectureReviewEntry:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        number:
          type: integer
          minimum: 1
        name:
          type: string
          maxLength: 255
        title:
          type: string
          maxLength: 500
        date:
          type: string
          format: date
          nullable: true
      required:
      - id
      - number
    License:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
      - id
      - name
    LicenseEnum:
      enum:
      - CC-BY-3.0
      - CC-BY-4.0
      - CC-BY-SA-3.0
      - CC-BY-SA-4.0
      - CC0-1.0
      type: string
      description: |-
        * `CC-BY-3.0` - CC BY 3.0
        * `CC-BY-4.0` - CC BY 4.0
        * `CC-BY-SA-3.0` - CC BY-SA 3.0
        * `CC-BY-SA-4.0` - CC BY-SA 4.0
        * `CC0-1.0` - CC0 1.0 (public domain dedication)
    ModerationAction:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ModerationActionActionEnum'
        note:
          type: string
          default: ''
          maxLength: 5000
      required:
      - action
    ModerationActionActionEnum:
      enum:
      - approve
      - reject
      - unpublish
      - resolve
      - take_down
      - dismiss
      type: string
      description: |-
        * `approve` - approve
        * `reject` - reject
        * `unpublish` - unpublish
        * `resolve` - resolve
        * `take_down` - take_down
        * `dismiss` - dismiss
    ModerationQueue:
      type: object
      properties:
        publications:
          type: array
          items:
            $ref: '#/components/schemas/Publication'
        reports:
          type: array
          items:
            $ref: '#/components/schemas/ContentReport'
        takedowns:
          type: array
          items:
            $ref: '#/components/schemas/TakedownRequest'
      required:
      - publications
      - reports
      - takedowns
    NodeSection:
      type: object
      properties:
        n:
          type: integer
        title:
          type: string
        text:
          type: string
        original:
          type: string
        edits:
          type: array
          items:
            $ref: '#/components/schemas/SectionEdit'
      required:
      - edits
      - n
      - original
      - text
      - title
    NodeSections:
      type: object
      properties:
        node:
          $ref: '#/components/schemas/StageNode'
        editable:
          type: boolean
        reason:
          type: string
