openapi: 3.0.3
info:
  title: LectureCast API
  version: 1.0.0
  description: The LectureCast backend API.
paths:
  /api/courses/:
    get:
      operationId: courses_list
      tags:
      - courses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
          description: ''
    post:
      operationId: courses_create
      tags:
      - courses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Course'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Course'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Course'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
  /api/courses/{course_id}/estimate:
    post:
      operationId: courses_estimate_create
      parameters:
      - in: path
        name: course_id
        schema:
          type: integer
        required: true
      tags:
      - pipeline
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineRunRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PipelineRunRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PipelineRunRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseEstimate'
          description: ''
  /api/courses/{course_id}/graph:
    get:
      operationId: courses_graph_retrieve
      parameters:
      - in: path
        name: course_id
        schema:
          type: integer
        required: true
      tags:
      - pipeline
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseGraph'
          description: ''
  /api/courses/{course_id}/review:
    post:
      operationId: courses_review_create
      parameters:
      - in: path
        name: course_id
        schema:
          type: integer
        required: true
      tags:
      - pipeline
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseReviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CourseReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CourseReviewRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseReviewResponse'
          description: ''
  /api/courses/{course_id}/runs:
    post:
      operationId: courses_runs_create
      parameters:
      - in: path
        name: course_id
        schema:
          type: integer
        required: true
      tags:
      - pipeline
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineRunRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PipelineRunRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PipelineRunRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRun'
          description: ''
  /api/courses/{id}/:
    get:
      operationId: courses_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course.
        required: true
      tags:
      - courses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
    put:
      operationId: courses_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course.
        required: true
      tags:
      - courses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Course'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Course'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Course'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
    patch:
      operationId: courses_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course.
        required: true
      tags:
      - courses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCourse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCourse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCourse'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
  /api/courses/upload-url:
    post:
      operationId: courses_upload_url_create
      tags:
      - courses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrl'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UploadUrl'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadUrl'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
          description: ''
  /api/health:
    get:
      operationId: health_retrieve
      description: Report that the API is up and can reach the database.
      tags:
      - health
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
  /api/lectures/{lecture_id}/slides:
    get:
      operationId: lectures_slides_list
      parameters:
      - in: path
        name: lecture_id
        schema:
          type: integer
        required: true
      tags:
      - lectures
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slide'
          description: ''
  /api/nodes/{node_id}/sections:
    get:
      operationId: nodes_sections_retrieve
      parameters:
      - in: path
        name: node_id
        schema:
          type: integer
        required: true
      tags:
      - pipeline
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeSections'
          description: ''
  /api/nodes/{node_id}/sections/{n}:
    put:
      operationId: nodes_sections_update
      parameters:
      - in: path
        name: n
        schema:
          type: integer
        required: true
      - in: path
        name: node_id
        schema:
          type: integer
        required: true
      tags:
      - pipeline
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectionUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SectionUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SectionUpdateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionUpdateResponse'
          description: ''
  /api/pipeline:
    get:
      operationId: pipeline_list
      tags:
      - pipeline
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StageDefinition'
          description: ''
  /api/providers:
    get:
      operationId: providers_list
      tags:
      - providers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Provider'
          description: ''
  /api/runs/{run_id}:
    get:
      operationId: runs_retrieve
      parameters:
      - in: path
        name: run_id
        schema:
          type: integer
        required: true
      tags:
      - runs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRun'
          description: ''
components:
  schemas:
    ActionEnum:
      enum:
      - reuse
      - run
      type: string
      description: |-
        * `reuse` - reuse
        * `run` - run
    Course:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        owner:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        source_url:
          oneOf:
          - type: string
            format: uri
          - type: string
            maxLength: 0
        source_file:
          type: string
          readOnly: true
        source_upload:
          type: string
          writeOnly: true
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        plugin:
          type: string
          maxLength: 100
        settings: {}
        license:
          type: string
          maxLength: 100
        visibility:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - owner
      - provider
      - source_file
      - title
      - updated_at
      - visibility
    CourseEstimate:
      type: object
      properties:
        targets:
          type: object
          additionalProperties: {}
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/StagePreview'
        estimate:
          type: object
          additionalProperties: {}
      required:
      - estimate
      - nodes
      - targets
    CourseGraph:
      type: object
      properties:
        course_id:
          type: integer
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/StageNode'
        lectures:
          type: array
          items:
            $ref: '#/components/schemas/Lecture'
      required:
      - course_id
      - lectures
      - nodes
    CourseReviewRequest:
      type: object
      properties:
        lectures:
          type: array
          items:
            $ref: '#/components/schemas/LectureReviewEntry'
      required:
      - lectures
    CourseReviewResponse:
      type: object
      properties:
        course_id:
          type: integer
        review:
          $ref: '#/components/schemas/StageNode'
        lectures:
          type: array
          items:
            $ref: '#/components/schemas/Lecture'
      required:
      - course_id
      - lectures
      - review
    HealthResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthResponseStatusEnum'
      required:
      - status
    HealthResponseStatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
    KindEnum:
      enum:
      - image
      - markdown
      - code
      type: string
      description: |-
        * `image` - Image
        * `markdown` - Markdown
        * `code` - Code
    Lecture:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        date:
          type: string
          format: date
          readOnly: true
          nullable: true
        included:
          type: boolean
          readOnly: true
        audio:
          type: string
          format: uri
          nullable: true
          readOnly: true
        duration_ms:
          type: integer
          readOnly: true
          nullable: true
      required:
      - audio
      - date
      - duration_ms
      - id
      - included
      - name
      - number
      - title
    LectureReviewEntry:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        number:
          type: integer
          minimum: 1
        name:
          type: string
          maxLength: 255
        title:
          type: string
          maxLength: 500
        date:
          type: string
          format: date
          nullable: true
      required:
      - id
      - number
    NodeSection:
      type: object
      properties:
        n:
          type: integer
        title:
          type: string
        text:
          type: string
        original:
          type: string
        edits:
          type: array
          items:
            $ref: '#/components/schemas/SectionEdit'
      required:
      - edits
      - n
      - original
      - text
      - title
    NodeSections:
      type: object
      properties:
        node:
          $ref: '#/components/schemas/StageNode'
        editable:
          type: boolean
        reason:
          type: string
          nullable: true
        sections:
          type: array
          items:
            $ref: '#/components/schemas/NodeSection'
      required:
      - editable
      - node
      - reason
      - sections
    PatchedCourse:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        owner:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        source_url:
          oneOf:
          - type: string
            format: uri
          - type: string
            maxLength: 0
        source_file:
          type: string
          readOnly: true
        source_upload:
          type: string
          writeOnly: true
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        plugin:
          type: string
          maxLength: 100
        settings: {}
        license:
          type: string
          maxLength: 100
        visibility:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PipelineRun:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        course:
          type: integer
          readOnly: true
        requested_by:
          type: integer
          readOnly: true
        targets:
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PipelineRunStatusEnum'
          readOnly: true
        estimate:
          readOnly: true
        actual_usage:
          readOnly: true
        error:
          type: string
          readOnly: true
        stage_runs:
          type: array
          items:
            $ref: '#/components/schemas/StageRun'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - actual_usage
      - course
      - created_at
      - error
      - estimate
      - finished_at
      - id
      - requested_by
      - stage_runs
      - started_at
      - status
      - targets
    PipelineRunRequest:
      type: object
      properties:
        stage:
          $ref: '#/components/schemas/PipelineRunRequestStageEnum'
        lecture_ids:
          type: array
          items:
            type: integer
            minimum: 1
      required:
      - stage
    PipelineRunRequestStageEnum:
      enum:
      - fetch
      - upload
      - review
      - materials
      - transcript
      - tts
      - render
      - assemble
      type: string
      description: |-
        * `fetch` - fetch
        * `upload` - upload
        * `review` - review
        * `materials` - materials
        * `transcript` - transcript
        * `tts` - tts
        * `render` - render
        * `assemble` - assemble
    PipelineRunStatusEnum:
      enum:
      - pending
      - running
      - succeeded
      - failed
      - canceled
      type: string
      description: |-
        * `pending` - Pending
        * `running` - Running
        * `succeeded` - Succeeded
        * `failed` - Failed
        * `canceled` - Canceled
    Provider:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        source_kind:
          $ref: '#/components/schemas/SourceKindEnum'
        settings_schema: {}
      required:
      - description
      - id
      - name
      - settings_schema
      - source_kind
    ProviderEnum:
      enum:
      - website
      - ocw
      - folder
      type: string
      description: |-
        * `website` - Course website
        * `ocw` - MIT OpenCourseWare
        * `folder` - Folder upload
    ScopeEnum:
      enum:
      - course
      - lecture
      type: string
      description: |-
        * `course` - course
        * `lecture` - lecture
    SectionEdit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        n:
          type: integer
          readOnly: true
        text:
          type: string
          readOnly: true
        edited_by_email:
          type: string
          format: email
          readOnly: true
          nullable: true
        edited_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - edited_at
      - edited_by_email
      - id
      - n
      - text
    SectionUpdateRequest:
      type: object
      properties:
        text:
          type: string
          maxLength: 200000
      required:
      - text
    SectionUpdateResponse:
      type: object
      properties:
        node:
          $ref: '#/components/schemas/StageNode'
        edit:
          allOf:
          - $ref: '#/components/schemas/SectionEdit'
          nullable: true
        stale_nodes:
          type: array
          items:
            $ref: '#/components/schemas/StageNode'
      required:
      - edit
      - node
      - stale_nodes
    Slide:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        n:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        image:
          type: string
          readOnly: true
        markdown:
          type: string
          readOnly: true
        code:
          type: string
          readOnly: true
        language:
          type: string
          readOnly: true
        width:
          type: integer
          readOnly: true
          nullable: true
        height:
          type: integer
          readOnly: true
          nullable: true
        narration:
          type: string
          readOnly: true
        start_ms:
          type: integer
          readOnly: true
          nullable: true
        end_ms:
          type: integer
          readOnly: true
          nullable: true
        source:
          type: string
          readOnly: true
        locator:
          type: string
          readOnly: true
      required:
      - code
      - end_ms
      - height
      - id
      - image
      - kind
      - language
      - locator
      - markdown
      - n
      - narration
      - source
      - start_ms
      - title
      - width
    SourceKindEnum:
      enum:
      - url
      - upload
      type: string
      description: |-
        * `url` - url
        * `upload` - upload
    StageDefinition:
      type: object
      properties:
        name:
          type: string
        scope:
          $ref: '#/components/schemas/ScopeEnum'
        dependencies:
          type: array
          items:
            type: string
        capability:
          type: string
        queue:
          type: string
        is_gate:
          type: boolean
      required:
      - capability
      - dependencies
      - is_gate
      - name
      - queue
      - scope
    StageNode:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        stage:
          allOf:
          - $ref: '#/components/schemas/StageNodeStageEnum'
          readOnly: true
        lecture:
          type: integer
          readOnly: true
          nullable: true
        lecture_title:
          type: string
          nullable: true
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StageNodeStatusEnum'
          readOnly: true
        settings_hash:
          type: string
          readOnly: true
        inputs_hash:
          type: string
          readOnly: true
        frozen:
          type: boolean
          readOnly: true
        error:
          type: string
          readOnly: true
        run_by_email:
          type: string
          format: email
          readOnly: true
          nullable: true
        latest_run:
          allOf:
          - $ref: '#/components/schemas/StageRun'
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - error
      - frozen
      - id
      - inputs_hash
      - latest_run
      - lecture
      - lecture_title
      - run_by_email
      - settings_hash
      - stage
      - status
      - updated_at
    StageNodeStageEnum:
      enum:
      - fetch
      - upload
      - review
      - materials
      - transcript
      - tts
      - render
      - assemble
      type: string
      description: |-
        * `fetch` - Fetch course website
        * `upload` - Import course archive
        * `review` - Review lecture list
        * `materials` - Prepare lecture materials
        * `transcript` - Write transcript
        * `tts` - Synthesize narration
        * `render` - Render slides
        * `assemble` - Assemble slideshow
    StageNodeStatusEnum:
      enum:
      - pending
      - queued
      - running
      - succeeded
      - failed
      - stale
      type: string
      description: |-
        * `pending` - Pending
        * `queued` - Queued
        * `running` - Running
        * `succeeded` - Succeeded
        * `failed` - Failed
        * `stale` - Stale
    StagePreview:
      type: object
      properties:
        stage:
          type: string
        lecture_id:
          type: integer
          nullable: true
        lecture_title:
          type: string
          nullable: true
        status:
          type: string
        action:
          $ref: '#/components/schemas/ActionEnum'
      required:
      - action
      - lecture_id
      - lecture_title
      - stage
      - status
    StageRun:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        stage:
          type: string
          readOnly: true
        lecture_id:
          type: integer
          readOnly: true
          nullable: true
        lecture_title:
          type: string
          nullable: true
          readOnly: true
        status:
          $ref: '#/components/schemas/StageRunStatusEnum'
        progress: {}
        log: {}
        usage: {}
        error:
          type: string
      required:
      - id
      - lecture_id
      - lecture_title
      - stage
    StageRunStatusEnum:
      enum:
      - blocked
      - queued
      - running
      - succeeded
      - failed
      - skipped
      type: string
      description: |-
        * `blocked` - Waiting for dependencies
        * `queued` - Queued
        * `running` - Running
        * `succeeded` - Succeeded
        * `failed` - Failed
        * `skipped` - Already up to date
    UploadUrl:
      type: object
      properties:
        provider:
          type: string
        filename:
          type: string
          maxLength: 255
      required:
      - filename
      - provider
    UploadUrlResponse:
      type: object
      properties:
        url:
          type: string
