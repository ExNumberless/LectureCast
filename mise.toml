[tools]
python = "3.13"
node = "lts"
uv = "latest"
pnpm = "12"
terraform = "latest"

[env]
_.file = ".env"  # see .env.example; gitignored

[tasks."dev:install"]
description = "Install the backend and frontend dependencies"
run = ["uv sync --directory backend", "pnpm --dir frontend install"]

[tasks."dev:up"]
alias = "dev"
description = "Run the whole stack with docker-compose"
run = "docker-compose up --build"

[tasks."dev:rebuild-frontend"]
description = "Recreate the frontend container and reinstall its dependencies"
run = "docker-compose up --force-recreate web"

[tasks.test]
description = "Run the backend and frontend tests"
run = ["uv run --directory backend pytest", "pnpm --dir frontend test"]

[tasks.lint]
description = "Check formatting, lint and types"
run = [
  "uv run --directory backend ruff format --check .",
  "uv run --directory backend ruff check .",
  "pnpm --dir frontend lint",
  "pnpm --dir frontend typecheck",
]

[tasks.format]
description = "Format and fix lint"
run = [
  "uv run --directory backend ruff format .",
  "uv run --directory backend ruff check --fix .",
  "pnpm --dir frontend lint --fix",
]

[tasks."dev:migrate"]
description = "Apply database migrations"
run = "uv run --directory backend python manage.py migrate"

[tasks.api-types]
description = "Generate the OpenAPI schema and TypeScript API types"
run = [
  "DJANGO_SECRET_KEY=type-generation-only DATABASE_URL=sqlite:////tmp/lecturecast-schema.sqlite3 REDIS_URL=redis://localhost:6379/0 uv run --directory backend python manage.py spectacular --file ../frontend/openapi.yaml --validate",
  "pnpm --dir frontend generate:api",
  "pnpm --dir frontend generate:player-types",
]
