name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lecturecast
          POSTGRES_PASSWORD: lecturecast
          POSTGRES_DB: lecturecast
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lecturecast"
          --health-interval 2s
          --health-retries 15
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://lecturecast:lecturecast@localhost:5432/lecturecast
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py spectacular --file ../frontend/openapi.yaml --validate
      - run: git -C .. diff --exit-code -- frontend/openapi.yaml
      - run: cmp tests/fixtures/player.schema.json ../frontend/player.schema.json
      - run: cmp tests/fixtures/slides.schema.json ../frontend/slides.schema.json
      - run: cmp tests/fixtures/player.json ../frontend/src/contracts/player.json
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate:api
      - run: pnpm run generate:player-types
      - run: git diff --exit-code -- openapi.yaml src/api/schema.d.ts src/contracts/player.types.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
